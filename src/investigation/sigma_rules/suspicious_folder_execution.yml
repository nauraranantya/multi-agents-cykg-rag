title: Program Execution in Suspicious Folder
id: ait-suspicious-folder-exec-001
status: experimental
description: >
  A process was executed from a world-writable or web-serving directory --
  the same pattern and MITRE mapping KRYSTAL (Kurniawan et al. 2022,
  Computers & Security, Fig. 7) uses as its own signature-detection example.
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        full_log|contains:
            - '/tmp/'
            - '/var/www/'
            - '/home/'
            - '/usr/local/apache2/'
    condition: selection
level: high
tags:
    - attack.t1204.002
    - attack.execution
