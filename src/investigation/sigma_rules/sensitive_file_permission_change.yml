title: Permission/Ownership Change on Sensitive System File
id: ait-sensitive-file-perm-001
status: experimental
description: Modification of permissions/ownership on a credential or auth-relevant file.
logsource:
    category: file_event
    product: linux
detection:
    selection_path:
        full_log|contains:
            - '/etc/passwd'
            - '/etc/shadow'
            - '/etc/sudoers'
    selection_action:
        rule_description|contains:
            - 'permission'
            - 'chmod'
            - 'chown'
            - 'modified'
    condition: selection_path and selection_action
level: high
tags:
    - attack.t1222
    - attack.defense_evasion
